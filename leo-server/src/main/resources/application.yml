server:
  port: 8080

spring:
  application:
    name: leo-blog-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 密码通过环境变量 MYSQL_PASSWORD 覆盖（默认 888888，本地开发）
    # 注意：characterEncoding 必须用 Java 编码名 UTF-8（驱动自动映射 utf8mb4），写 utf8mb4 会报 Unsupported character encoding
    url: jdbc:mysql://127.0.0.1:3306/leo_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:888888}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL；生产可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.leo.blog: info
